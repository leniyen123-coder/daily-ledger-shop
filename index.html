<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天天記帳舖</title>
<meta name="description" content="天天記帳舖：會掃碼、會印收據的 3D 小商店記帳網頁。">
<meta name="theme-color" content="#2FB8A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="天天記帳舖">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Clay-diorama world: cool studio backdrop with toy-like mint / sun / tomato / lilac accents.
     Layout: one fixed 1200x720 stage scaled to fit; the order card docks inside on wide screens, below on phones. */
  --bg:#E4E9F2;
  --ink:#2A2F45;
  --ink-2:#5B6380;
  --mint:#2FB8A6;
  --sun:#FFC94D;
  --tomato:#F0614F;
  --lilac:#8E7CF0;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 24px}
.stage-wrap{position:relative;width:100%;max-width:1560px}
.stage{position:absolute;top:0;left:0;width:1200px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:34px;
  background:
    radial-gradient(60% 18% at 36% 98%, rgba(42,47,69,.22), rgba(42,47,69,0) 70%),
    radial-gradient(90% 70% at 50% 0%, #FFFFFF 0%, #EEF2F8 55%, #D9E0EC 100%);
  box-shadow:0 40px 80px -40px rgba(42,47,69,.5), inset 0 2px 0 #fff;}
.mobile-slot{width:100%;max-width:560px;margin-top:14px}

/* ---------- top-left round buttons ---------- */
.rbtn{position:absolute;top:44px;width:102px;height:102px;border-radius:50%;border:0;cursor:pointer;z-index:9;
  font-family:var(--f-display);font-size:20px;line-height:1.05;letter-spacing:.06em;display:grid;place-items:center;align-content:center;gap:4px;
  background:radial-gradient(70% 70% at 34% 26%, rgba(255,255,255,.8), rgba(255,255,255,0) 58%), var(--c);
  box-shadow:0 9px 0 var(--d), 0 24px 30px -10px rgba(42,47,69,.5), inset 0 -10px 18px rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.6);
  transition:transform .12s ease, box-shadow .12s ease}
.rbtn:hover{transform:translateY(-3px)}
.rbtn:active,.rbtn.pressed{transform:translateY(8px);box-shadow:0 1px 0 var(--d),0 8px 14px -6px rgba(42,47,69,.5), inset 0 -6px 12px rgba(0,0,0,.12)}
.rbtn svg{width:30px;height:30px}
.rbtn small{font-size:13px;letter-spacing:.1em;opacity:.85}
#btnCust{left:40px;--c:#A99BF6;--d:#6C5BD0;color:#fff}
#btnCart{left:156px;--c:#7FE3D2;--d:#1E9C8C;color:#0B4A42}
#btnRec{left:272px;--c:#FFD76A;--d:#D3A02A;color:#4A3500}
#btnPay{left:388px;--c:#FF7B6A;--d:#C9473A;color:#fff}
.badge{position:absolute;top:2px;right:2px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--tomato);color:#fff;
  font-family:var(--f-body);font-size:14px;font-weight:700;line-height:26px;box-shadow:0 3px 6px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}
.rbtn.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.15)}60%{transform:scale(.95)}}

/* ---------- HUD ---------- */
.hud{position:absolute;left:510px;top:48px;width:252px;z-index:8}
.hud .date{font-family:var(--f-display);font-size:28px;line-height:1.1}
.hud .date span{font-size:18px;color:var(--ink-2);margin-left:6px}
.hud .today{margin-top:8px;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hud .today b{color:var(--ink);font-size:18px}
.hud .row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#fff;border:0;
  box-shadow:0 4px 10px -4px rgba(42,47,69,.35);font-size:13px;color:var(--ink-2);cursor:default}
.chip svg{width:16px;height:16px}
button.chip{cursor:pointer}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#B9C0D0}
.chip.sync-cloud .dot{background:var(--mint)}
.chip.sync-load .dot{background:var(--sun);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- store diorama ---------- */
#store{position:absolute;left:40px;top:200px;width:660px;height:500px;z-index:1;overflow:visible}
.store-shadow{position:absolute;left:46px;top:212px;width:648px;height:494px;border-radius:24px;z-index:0;box-shadow:0 22px 30px -8px rgba(42,47,69,.35)}
#store text{font-family:var(--f-display)}
.s-wall{fill:var(--wall)} .s-wain{fill:var(--wain)} .s-side{fill:var(--side)} .s-ceil{fill:var(--ceil)} .s-floor{fill:var(--floor)}
.s-ctop{fill:var(--ctop)} .s-cfront{fill:var(--cfront)} .s-cstripe{fill:var(--cstripe)} .s-shelf{fill:var(--shelf)}
.s-trim{fill:var(--trim)} .s-trimStroke{stroke:var(--trim)} .s-sign{fill:var(--sign)} .s-signText{fill:var(--signText)} .s-lamp{fill:var(--lamp)}
.hot{cursor:pointer}
#cashierWrap{outline:none}
.hot:hover{filter:brightness(1.06) saturate(1.08)}
#zzz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translate(-4px,-6px);opacity:.4}}
.lights-blink{animation:pulse 1.6s infinite}

/* ---------- bubble ---------- */
.bubble{position:absolute;left:556px;top:234px;z-index:7;min-width:120px;max-width:212px;padding:10px 16px;border-radius:22px;background:#fff;
  font-family:var(--f-display);font-size:17px;line-height:1.35;color:var(--ink);box-shadow:0 10px 22px -10px rgba(42,47,69,.5);
  transition:transform .25s ease}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;width:22px;height:18px;background:#fff;clip-path:polygon(0 0,100% 0,10% 100%)}
.bubble.talk{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}}
.bubble .pts{display:flex;align-items:center;gap:8px;white-space:nowrap}
.bubble .pts small{font-size:13px;color:var(--ink-2)}
.bubble .pts b{font-size:24px;color:#B9770E;font-variant-numeric:tabular-nums}
.bubble .star{color:#F5B400;font-size:20px}
.mini-bubble{position:absolute;z-index:7;padding:6px 12px;border-radius:16px;background:#fff;font-family:var(--f-display);font-size:15px;
  box-shadow:0 8px 16px -8px rgba(42,47,69,.5);animation:pop .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}

/* ---------- conveyor ---------- */
.belt{position:absolute;left:592px;top:512px;width:604px;height:170px;z-index:2;pointer-events:none}
.belt-top{position:absolute;left:0;top:0;width:100%;height:44px;border-radius:22px 0 0 22px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%, rgba(0,0,0,.25)),
    repeating-linear-gradient(115deg, #3B4155 0 30px, #262A38 30px 35px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.belt-front{position:absolute;left:0;top:44px;width:100%;height:24px;border-radius:0 0 0 14px;
  background:linear-gradient(180deg,#E3E8F0,#A3ADBF 70%,#8590A4)}
.belt-front::before{content:"";position:absolute;inset:8px 20px auto 20px;height:6px;
  background:radial-gradient(circle,#6D778B 2.2px,transparent 2.6px) 0 0/40px 6px}
.belt-leg{position:absolute;top:68px;width:16px;height:92px;border-radius:4px;background:linear-gradient(90deg,#8590A4,#D7DDE7 40%,#7B8599)}
.belt-leg::after{content:"";position:absolute;left:-10px;bottom:-4px;width:36px;height:8px;border-radius:4px;background:#5A6378}
.belt-roller{position:absolute;left:-8px;top:8px;width:30px;height:56px;border-radius:15px;background:linear-gradient(90deg,#6D778B,#E8ECF2 45%,#8590A4)}

/* ---------- items ---------- */
.item{position:absolute;left:0;top:0;width:96px;height:96px;z-index:5;will-change:transform;pointer-events:none}
.item-in{width:100%;height:100%;position:relative}
.item.drop .item-in{animation:drop .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(-150px) scale(.8,1.2)}70%{transform:translateY(0) scale(1.08,.92)}}
.item.moving .item-in{animation:wob .45s ease-in-out infinite alternate}
@keyframes wob{to{transform:translateY(-2px) rotate(-1.5deg)}}
.item svg{width:96px;height:96px;display:block}
.item .tag{position:absolute;right:-6px;top:4px;padding:2px 8px;border-radius:10px;background:#fff;font-family:var(--f-display);font-size:13px;
  box-shadow:0 4px 8px -4px rgba(42,47,69,.5);white-space:nowrap;font-variant-numeric:tabular-nums}
.fx{position:absolute;inset:0;width:1200px;height:720px;z-index:6;pointer-events:none}
.beep-text{position:absolute;z-index:7;font-family:var(--f-display);font-style:italic;font-size:26px;color:#7B5CFF;pointer-events:none;
  text-shadow:0 2px 0 #fff;animation:beepUp .8s ease forwards}
@keyframes beepUp{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.spark{position:absolute;z-index:7;width:10px;height:10px;border-radius:50%;background:#FFE27A;pointer-events:none;box-shadow:0 0 10px #FFC94D}
.heart{position:absolute;z-index:7;font-size:22px;color:#FF6B8B;pointer-events:none;animation:heart 1.3s ease-out forwards}
@keyframes heart{to{transform:translate(var(--dx),-70px) scale(1.3);opacity:0}}

/* ---------- order card ---------- */
.order{position:absolute;left:772px;top:28px;width:396px;padding:20px 22px 22px;border-radius:26px;z-index:8;
  background:linear-gradient(180deg,#FFFFFF,#F5F7FB);
  box-shadow:inset 0 2px 0 #fff, 0 20px 40px -18px rgba(42,47,69,.45), 0 0 0 1px rgba(42,47,69,.06)}
.mobile-slot .order{position:relative;left:auto;top:auto;width:100%}
.order h2{margin:0 0 12px;font-family:var(--f-display);font-weight:400;font-size:21px;display:flex;align-items:center;gap:8px}
.order h2 small{font-family:var(--f-body);font-size:12px;color:var(--ink-2);margin-left:auto}
.field{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:10px;margin-bottom:10px}
.field>label,.field>.lbl{font-family:var(--f-display);font-size:18px}
.field input{width:100%;height:42px;border-radius:14px;border:2px solid #E1E6EF;background:#fff;padding:0 14px;font-size:16px;color:var(--ink);
  box-shadow:inset 0 2px 4px rgba(42,47,69,.06);transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--lilac)}
.cat-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-2px}
.cat-btn{border:2px solid transparent;border-radius:16px;background:#EEF1F7;padding:4px 2px 6px;display:grid;justify-items:center;cursor:pointer;font-size:13px;
  transition:background .15s, box-shadow .15s, border-color .15s}
.cat-btn svg{width:48px;height:48px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.cat-btn:hover svg{transform:translateY(-3px) rotate(-5deg)}
.cat-btn[aria-checked="true"]{background:#fff;border-color:var(--lilac);box-shadow:0 8px 16px -8px rgba(142,124,240,.8)}
.price{position:relative}
.price span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--f-display);color:var(--ink-2);font-size:15px}
.price input{padding-left:50px;font-variant-numeric:tabular-nums}
.ok-row{display:flex;align-items:center;gap:12px;margin-top:6px}
.ok-btn{flex:1;height:52px;border:0;border-radius:18px;cursor:pointer;font-family:var(--f-display);font-size:22px;letter-spacing:.3em;color:#fff;
  background:radial-gradient(60% 90% at 30% 10%, rgba(255,255,255,.45), rgba(255,255,255,0) 60%), var(--mint);
  box-shadow:0 6px 0 #1E8A7C, 0 16px 22px -10px rgba(30,138,124,.7);transition:transform .1s, box-shadow .1s}
.ok-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1E8A7C,0 6px 10px -6px rgba(30,138,124,.7)}
.msg{min-height:18px;font-size:13px;color:var(--tomato);margin-top:8px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none}
.overlay.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(24,27,46,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.overlay.show .backdrop{opacity:1}
.ov-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 14px calc(18px + env(safe-area-inset-left));z-index:5;color:#fff;
  opacity:0;transition:opacity .4s .2s}
.overlay.show .ov-top{opacity:1}
.ov-top h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.ov-top .sp{flex:1}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#fff;color:var(--ink);font-family:var(--f-display);font-size:16px}
.pchip b{color:#B9770E;font-size:20px;font-variant-numeric:tabular-nums}
.pchip.glow{animation:bump .5s}
.ghost{border:0;border-radius:999px;padding:8px 16px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;font-size:14px}
.ghost:hover{background:rgba(255,255,255,.28)}
.solid{border:0;border-radius:999px;padding:10px 20px;background:var(--sun);color:#3A2A00;cursor:pointer;font-family:var(--f-display);font-size:17px;
  box-shadow:0 5px 0 #C99A25}
.solid:active{transform:translateY(4px);box-shadow:0 1px 0 #C99A25}
.print-stage{position:absolute;left:50%;bottom:calc(3vh + env(safe-area-inset-bottom));width:var(--pw);transform:translateX(-50%);z-index:3}
.big-printer{position:relative;width:100%;z-index:2;transform-origin:0 0}
.big-printer svg{display:block;width:100%;height:auto;overflow:visible}
.big-printer.printing svg{animation:jitter .09s linear infinite}
@keyframes jitter{50%{transform:translate(.6px,-.6px)}}
.big-printer.printing .led1,.big-printer.printing .led2{animation:pulse .25s infinite}
.paper-wrap{position:absolute;left:calc(var(--pw) * 62 / 240);width:calc(var(--pw) * 116 / 240);bottom:calc(var(--pw) * 120 / 240);z-index:3;
  transform:perspective(900px) rotateX(6deg);transform-origin:50% 100%}
.paper{position:absolute;left:0;right:0;bottom:0;height:0;overflow:hidden;background:#FFFEFA;
  box-shadow:0 -6px 20px -6px rgba(0,0,0,.35);border-radius:2px 2px 0 0}
.paper::-webkit-scrollbar{width:0}
.paper-inner{position:absolute;left:0;right:0;top:0}
.paper .receipt{font-size:clamp(10.5px, calc(var(--pw) * .0235), 12.5px)}
.print-done{position:absolute;right:calc(20px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;display:none;gap:10px;align-items:center;
  opacity:0;transform:translateY(10px);transition:opacity .3s, transform .3s}
.print-done.on{display:flex;animation:doneIn .35s ease forwards}
@keyframes doneIn{to{opacity:1;transform:none}}
.print-done .solid{padding:12px 24px;font-size:18px}
.print-done .ghost{padding:10px 18px}
@media (max-width:700px){
  .print-stage{bottom:calc(76px + env(safe-area-inset-bottom))}
  .print-done{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));justify-content:flex-end}
}
.scroll-hint{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);z-index:6;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.92);color:var(--ink);font-size:13px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:none}
.scroll-hint.on{opacity:1}
.earn-pop{position:fixed;z-index:60;font-family:var(--f-display);font-size:30px;color:#FFE27A;text-shadow:0 3px 0 #9C6A00;pointer-events:none;animation:beepUp 1.4s ease forwards}
.coin{position:fixed;z-index:61;width:22px;height:22px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%, #FFF4B8, #FFC94D 50%, #D99A00);box-shadow:0 2px 0 #A87400;display:grid;place-items:center;color:#9C6A00;font-size:12px}

/* ---------- receipt ---------- */
.receipt{color:#23252B;font-size:12.5px;line-height:1.45;padding:0 14px;font-variant-numeric:tabular-nums}
.rl{position:relative}
.r-top{height:12px;margin:0 -14px;background:linear-gradient(135deg,transparent 6px,#FFFEFA 0) 0 0/12px 12px repeat-x, linear-gradient(225deg,transparent 6px,#FFFEFA 0) 0 0/12px 12px repeat-x;background-color:transparent}
.r-store{text-align:center;font-family:var(--f-display);font-size:1.2em;padding-top:6px}
.r-title{text-align:center;font-weight:900;font-size:1.36em;letter-spacing:.06em}
.r-period{text-align:center;font-weight:900;font-size:1.52em}
.r-no{text-align:center;font-weight:900;font-size:1.52em;letter-spacing:.04em}
.r-meta,.r-meta2{display:flex;justify-content:space-between;gap:6px;font-size:.92em}
.r-meta{justify-content:center}
.r-bar{height:34px;margin:6px 0 4px;overflow:hidden;display:flex;align-items:stretch;justify-content:center;gap:0}
.r-bar i{display:block;background:#1C1D22}
.r-qr{display:flex;justify-content:space-between;padding:4px 6px 8px}
.r-qr svg{width:44%;height:auto}
.r-sep{text-align:center;color:#7B7F8C;font-size:.88em;letter-spacing:.15em;padding:4px 0}
.r-item{display:grid;grid-template-columns:1.76em minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 0}
.r-item.editable{grid-template-columns:1.76em minmax(0,1fr) auto 30px}
.r-item svg{width:1.76em;height:1.76em}
.r-item span{overflow-wrap:anywhere}.r-item small{display:block;color:#7B7F8C;font-size:.84em}
.r-item .amt{font-weight:700}
.ri-del{width:30px;height:30px;border-radius:50%;border:0;background:#F2F3F6;color:#9A9FB0;cursor:pointer;font-size:15px;line-height:1}
.ri-del:hover{background:#FFE1DC;color:var(--tomato)}
.r-sep2{border-top:1.5px dashed #9CA0AC;margin:6px 0}
.r-total{display:flex;justify-content:space-between;font-weight:900;font-size:1.28em;padding:2px 0}
.r-earn{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.r-earn b{color:#B9770E}
.r-thanks{text-align:center;font-size:.92em;color:#565A66;padding:10px 0 6px}
.r-end{height:22px}
.receipt.torn .r-end{background:linear-gradient(45deg,transparent 6px,#FFFEFA 0) 0 100%/12px 12px repeat-x, linear-gradient(-45deg,transparent 6px,#FFFEFA 0) 0 100%/12px 12px repeat-x;margin:0 -14px}

/* ---------- modal sheets ---------- */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .25s;
  width:min(560px,94vw);max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:28px;background:linear-gradient(180deg,#FFFFFF,#F2F5FA);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.55);padding:20px 22px 22px}
.overlay.show .sheet{transform:translate(-50%,-50%);opacity:1}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.sheet-h .sp{flex:1}
.x-btn{width:38px;height:38px;border-radius:50%;border:0;background:#E9EDF4;cursor:pointer;font-size:20px;color:var(--ink-2)}
.x-btn:hover{background:#DDE3EE}
.month{margin:8px 0 4px;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
.month b{color:var(--ink);font-size:18px}
.clip-area{position:relative;height:470px;margin-top:8px;perspective:1300px;touch-action:pan-y;user-select:none}
.clip-svg{position:absolute;left:50%;top:0;width:150px;transform:translateX(-50%);z-index:300;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.board{position:absolute;left:50%;top:44px;width:min(330px, 100%);height:420px;transform:translateX(-50%);border-radius:18px;
  background:linear-gradient(160deg,#D8B48A,#B98D5D);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 14px 28px -12px rgba(0,0,0,.4)}
.slip{position:absolute;left:0;right:0;margin:0 auto;top:56px;width:min(290px, calc(100% - 40px));transform-origin:50% 0;transition:transform .45s cubic-bezier(.3,1.2,.5,1),opacity .35s;
  background:#FFFEFA;border-radius:3px 3px 0 0;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);cursor:pointer;backface-visibility:hidden}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
  background:linear-gradient(45deg,transparent 5px,#FFFEFA 0) 0 0/10px 10px repeat-x,linear-gradient(-45deg,transparent 5px,#FFFEFA 0) 0 0/10px 10px repeat-x}
.slip-in{padding:50px 18px 14px;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative;min-height:330px}
.slip-store{text-align:center;font-family:var(--f-display);font-size:14px;color:var(--ink-2)}
.slip-title{text-align:center;font-weight:900;font-size:17px;margin-top:2px}
.slip-date{text-align:center;font-family:var(--f-display);font-size:20px;margin:4px 0 8px}
.slip-row{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;padding:2px 0;border-bottom:1px dotted #D5D8E0}
.slip-row svg{width:20px;height:20px}
.slip-row span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slip .more{color:#8A8FA0;font-size:11.5px;padding-top:4px}
.slip-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-weight:900}
.slip-total b{font-size:20px}
.slip-foot{color:#6E7386;font-size:12px;margin-top:2px}
.stamp{position:absolute;right:16px;bottom:58px;transform:rotate(-14deg);border:3px solid currentColor;border-radius:10px;padding:2px 10px;
  font-family:var(--f-display);font-size:18px;opacity:.75}
.stamp.ok{color:#D2463A}
.stamp.no{color:#8A90A3}
.rec-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.nav-btn{width:40px;height:40px;border-radius:50%;border:0;background:#E9EDF4;cursor:pointer;font-size:20px}
.nav-btn:disabled{opacity:.35;cursor:default}
.rec-label{font-family:var(--f-display);font-size:18px;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}
.scrub{display:flex;gap:3px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.scrub i{width:14px;height:6px;border-radius:3px;background:#D5DAE4}
.scrub i.on{background:var(--lilac)}
.hint{text-align:center;color:var(--ink-2);font-size:13px;margin-top:8px}
.empty{padding:60px 20px;text-align:center;color:var(--ink-2);line-height:1.7}
.detail-paper{background:#FFFEFA;border-radius:4px;margin-top:12px;box-shadow:0 6px 16px -8px rgba(0,0,0,.3);padding-bottom:4px}
.detail-paper .receipt{font-size:13.5px}

/* ---------- customize drawer ---------- */
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(400px,100vw);background:linear-gradient(180deg,#FFFFFF,#F2F5FA);
  box-shadow:-20px 0 50px -20px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .4s cubic-bezier(.3,1.1,.5,1);display:flex;flex-direction:column}
.overlay.show .drawer{transform:none}
#custOv .backdrop{background:rgba(24,27,46,.25);backdrop-filter:none;-webkit-backdrop-filter:none}
.drawer-h{padding:calc(18px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:10px}
.drawer-h h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.drawer-h .sp{flex:1}
.tabs{display:flex;gap:6px;padding:0 20px}
.tab{flex:1;height:40px;border:0;border-radius:14px;background:#E9EDF4;cursor:pointer;font-family:var(--f-display);font-size:17px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.drawer-b{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 20px calc(28px + env(safe-area-inset-bottom))}
.sec{margin-bottom:18px}
.sec h4{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:17px;display:flex;align-items:baseline;gap:8px}
.sec h4 small{font-family:var(--f-body);font-size:12px;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative;border:2px solid transparent;border-radius:16px;background:#fff;padding:8px 6px 8px;cursor:pointer;display:grid;justify-items:center;gap:4px;
  box-shadow:0 6px 14px -8px rgba(42,47,69,.4);font-size:13px;transition:transform .15s,border-color .15s}
.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--lilac)}
.opt .sw{width:54px;height:54px;border-radius:14px;display:block}
.opt .sw.round{border-radius:50%}
.opt .st{font-size:11.5px;color:var(--ink-2)}
.opt .st.cost{color:#A06A00;font-weight:700}
.opt.locked .sw{filter:grayscale(.5) brightness(.95)}
.opt.confirm{border-color:var(--sun);background:#FFF8E1}
.opt.cant{animation:shake .4s}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;height:42px;border-radius:14px;border:2px solid #E1E6EF;padding:0 12px;font-size:16px}
.name-row input:focus{outline:none;border-color:var(--lilac)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.fly-paper{position:fixed;z-index:70;pointer-events:none;background:#FFFEFA;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- shopping list ---------- */
.cart-sub{margin:0 20px 10px;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.cart-add{margin:0 20px;padding:12px;border-radius:18px;background:#fff;box-shadow:0 8px 18px -12px rgba(42,47,69,.45)}
.cart-add-row{display:grid;grid-template-columns:1fr 92px;gap:8px}
.cart-add input{width:100%;height:42px;border-radius:12px;border:2px solid #E1E6EF;padding:0 12px;font-size:16px;color:var(--ink);background:#fff}
.cart-add input:focus{outline:none;border-color:var(--mint)}
.cart-cats{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0 10px}
.ccat{border:2px solid transparent;border-radius:12px;background:#EEF1F7;padding:3px 0 2px;cursor:pointer;display:grid;justify-items:center;font-size:10.5px;color:var(--ink-2)}
.ccat svg{width:30px;height:30px}
.ccat[aria-checked="true"]{background:#fff;border-color:var(--mint);color:var(--ink)}
.cart-add-btn{width:100%;background:var(--mint);color:#fff;box-shadow:0 5px 0 #1E8A7C}
.cart-add-btn:active{box-shadow:0 1px 0 #1E8A7C}
.cart-sum{margin:14px 20px 0;font-size:13.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.cart-sum b{color:var(--ink)}
#cartList{padding-top:8px}
.crow{display:grid;grid-template-columns:38px 34px minmax(0,1fr) 84px 32px;align-items:center;gap:8px;padding:9px 10px;margin-bottom:8px;border-radius:16px;background:#fff;
  box-shadow:0 6px 14px -10px rgba(42,47,69,.5);transition:background .2s, opacity .2s}
.crow.done{background:#EAF7F4}
.crow.done .cn{text-decoration:line-through;text-decoration-color:rgba(42,47,69,.45);color:var(--ink-2)}
.cbox{width:34px;height:34px;border-radius:11px;border:2.5px solid #C5CCDA;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.cbox svg{width:20px;height:20px;opacity:0;transform:scale(.4);transition:transform .25s cubic-bezier(.3,1.8,.5,1),opacity .15s}
.cbox[aria-checked="true"]{background:var(--mint);border-color:#1E9C8C}
.cbox[aria-checked="true"] svg{opacity:1;transform:none}
.crow .cic{width:34px;height:34px}
.cname{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.cname small{display:block;font-size:11.5px;color:var(--ink-2);text-decoration:none}
.crow.done .cname small{color:#1E8A7C}
.cprice{position:relative;display:block}
.cprice span{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:13px}
.cprice input{width:100%;height:36px;border-radius:10px;border:2px solid #E1E6EF;padding:0 6px 0 20px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink);background:#fff}
.cprice input:focus{outline:none;border-color:var(--mint)}
.cprice input:disabled{background:transparent;border-color:transparent;color:var(--ink-2)}
.cdel{width:30px;height:30px;border-radius:50%;border:0;background:#F2F3F6;color:#9A9FB0;cursor:pointer;font-size:15px;padding:0}
.cdel.arm{background:#FFE1DC;color:var(--tomato);font-size:12px}
.cart-empty{padding:18px 6px;color:var(--ink-2);font-size:14px;line-height:1.6;text-align:center}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.sugg button{border:0;border-radius:999px;padding:7px 12px;background:#fff;box-shadow:0 4px 10px -6px rgba(42,47,69,.5);cursor:pointer;font-size:13.5px}
@media (max-width:380px){ .crow{grid-template-columns:34px 28px minmax(0,1fr) 74px 30px;gap:6px;padding:8px} .crow .cic{width:28px;height:28px} }

/* ---------- phones & tablets ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
.app{padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
button,.stage,.clip-area,.opt,.cat-btn{touch-action:manipulation}
.stage,.rbtn,.clip-area{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mtool{display:none}
body.compact .app{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:start;gap:12px}
body.compact .mtool{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;width:100%;max-width:920px}
body.compact .mtool .btns{display:flex;gap:12px}
body.compact .badge{top:-4px;right:-4px;min-width:22px;height:22px;line-height:22px;font-size:12px;padding:0 6px}
body.compact .rbtn,body.compact #btnCust,body.compact #btnCart,body.compact #btnRec,body.compact #btnPay{position:relative;top:auto;left:auto;width:68px;height:68px;font-size:15px;gap:2px;
  box-shadow:0 6px 0 var(--d),0 14px 18px -8px rgba(42,47,69,.45),inset 0 -6px 12px rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.6)}
body.compact .rbtn:active,body.compact .rbtn.pressed{transform:translateY(5px);box-shadow:0 1px 0 var(--d),inset 0 -6px 12px rgba(0,0,0,.12)}
body.compact .rbtn svg{width:20px;height:20px}
body.compact .rbtn small{font-size:10px}
body.compact .hud{position:static;width:auto;flex:1 1 220px}
body.compact .hud .date{font-size:24px}
body.compact .hud .today{margin-top:4px}
body.compact .hud .row{margin-top:8px}
body.compact .stage-wrap{max-width:920px;border-radius:24px;overflow:hidden;box-shadow:0 24px 50px -28px rgba(42,47,69,.6)}
body.compact .stage{border-radius:0;box-shadow:none}
body.compact .mobile-slot{max-width:640px;margin-top:0}
body.side .app{grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-areas:"tool form" "scene form";grid-template-rows:auto 1fr;align-items:start;justify-items:stretch;column-gap:16px}
body.side .mtool{grid-area:tool}
body.side .stage-wrap{grid-area:scene;justify-self:center}
body.side .mobile-slot{grid-area:form;max-width:none}
body.side .rbtn,body.side #btnCust,body.side #btnCart,body.side #btnRec,body.side #btnPay{width:58px;height:58px;font-size:13px}
body.side .hud{flex:1 1 150px}
body.side .hud .date{font-size:19px}
body.side .hud .today{font-size:13px}
body.side .hud .row{margin-top:6px}
body.side .chip{height:26px;padding:0 9px;font-size:12px}
body.side .mtool{gap:8px 12px}
@media (max-width:380px){
  body.compact .rbtn,body.compact #btnCust,body.compact #btnCart,body.compact #btnRec,body.compact #btnPay{width:60px;height:60px;font-size:14px}
  body.compact .mtool .btns{gap:9px}
}
@media (max-width:480px){
  .order{padding:16px 14px}
  .field{grid-template-columns:44px 1fr;gap:8px}
  .field>label,.field>.lbl{font-size:16px}
  .cat-grid{gap:6px}
  .cat-btn{font-size:12.5px}
  .cat-btn svg{width:40px;height:40px}
  #orderHint{display:none}
  .opts{gap:6px}
  .opt .sw{width:48px;height:48px}
  .clip-area{height:450px}
  .board{height:400px}
}
@media (max-height:500px){
  .order{padding:14px 16px}
  .order h2{margin-bottom:8px}
  .field{margin-bottom:7px}
  .cat-btn svg{width:34px;height:34px}
  .ok-btn{height:46px}
}
@media (hover:none){
  .hot:hover{filter:none}
  .rbtn:hover{transform:none}
  .cat-btn:hover svg{transform:none}
  .opt:hover{transform:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

async function flushDoc(id, getData){
  const st = R.w[id]; st.busy = true;
  while (st.dirty && R.ok){
    st.dirty = false;
    const data = JSON.parse(JSON.stringify(getData() || {}));
    const ref = R.db.collection('data/users/' + R.uid).doc(id);
    try { await ref.set(data); }
    catch(e){
      if (e && e.code === 'unavailable'){ await sleep(400 + Math.random()*600); try { await ref.set(data); continue; } catch(e2){} }
      R.ok = false; setSync('local');
      if (e && e.code === 'quota_exceeded') toast('帳號空間已滿，資料先存在這個瀏覽器');
    }
  }
  st.busy = false;
}
const saveState = () => writeDoc('state', () => S);
const saveDay = k => writeDoc('day-' + k, () => DAYS[k]);
async function initRemote(){
  if (!(window.claude && typeof window.claude.use === 'function')) { setSync('local'); return; }
  setSync('load');
  let settled = false;
  const timer = setTimeout(() => { if (!settled) setSync('local'); }, 10000);
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) throw 0;
    const uid = await user.id();
    if (!uid) throw 0;
    const snap = await db.collection('data/users/' + uid).get();
    settled = true; clearTimeout(timer);
    R.db = db; R.uid = uid; R.ok = true;
    let rState = null; const rDays = {};
    snap.docs.forEach(d => { if (!d.exists) return; const v = JSON.parse(JSON.stringify(d.data())); if (d.id === 'state') rState = v; else if (d.id.startsWith('day-')) rDays[d.id.slice(4)] = normDay(d.id.slice(4), v); });
    if (rState) { const muted = S.muted; S = normState(rState); S.muted = muted; } else saveState();
    const keys = new Set([...Object.keys(rDays), ...Object.keys(DAYS)]);
    keys.forEach(k => {
      const a = rDays[k], b = DAYS[k];
      if (a && !b) { DAYS[k] = a; return; }
      if (b && !a) { DAYS[k] = b; saveDay(k); return; }
      const ids = new Set(a.entries.map(e => e.id));
      const extra = b.entries.filter(e => !ids.has(e.id));
      const m = normDay(k, Object.assign({}, b, a));
      m.entries = [...a.entries, ...extra].sort((x,y) => (x.t||'') < (y.t||'') ? -1 : 1);
      m.rewarded = Math.max(a.rewarded||0, b.rewarded||0);
      m.settled = a.settled || b.settled;
      DAYS[k] = m;
      if (extra.length) saveDay(k);
    });
    saveLocal();
    setSync('cloud');
    applyAll();
  } catch(e){
    settled = true; clearTimeout(timer); setSync('local');
  }
}

/* ================= audio ================= */
let AC = null, master = null, noise = null;
function audio(){
  if (S.muted) return null;
  try {
    if (!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination); try { const sb = AC.createBufferSource(); sb.buffer = AC.createBuffer(1, 1, 22050); sb.connect(AC.destination); sb.start(0); } catch(e){} }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  } catch(e){ return null; }
}
function noiseBuf(a){ if (!noise){ noise = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noise.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; } return noise; }
function env(g, t, peak, a, hold, r){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+a); g.gain.setValueAtTime(peak, t+a+hold); g.gain.exponentialRampToValueAtTime(0.0001, t+a+hold+r); }
function beep(){
  const a = audio(); if (!a) return; const t = a.currentTime;
  [2480, 4960].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = i ? 'sine' : 'square'; o.frequency.value = f; env(g, t, i ? .02 : .07, .006, .11, .03); o.connect(g).connect(master); o.start(t); o.stop(t+.2); });
}
function buzz(sec){
  const a = audio(); if (!a) return; const t = a.currentTime;
  const src = a.createBufferSource(); src.buffer = noiseBuf(a); src.loop = true;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3300; bp.Q.value = 1.1;
  const chat = a.createGain(); chat.gain.value = .06;
  const lfo = a.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 62 + Math.random()*10;
  const lg = a.createGain(); lg.gain.value = .06; lfo.connect(lg).connect(chat.gain);
  const motor = a.createOscillator(); motor.type = 'sawtooth'; motor.frequency.value = 118;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
  const mg = a.createGain(); mg.gain.value = .05;
  const out = a.createGain();
  out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(1, t+.012); out.gain.setValueAtTime(1, t+Math.max(.03, sec-.02)); out.gain.linearRampToValueAtTime(0, t+sec);
  src.connect(bp).connect(chat).connect(out);
  motor.connect(lp).connect(mg).connect(out);
  out.connect(master);
  [src, lfo, motor].forEach(n => { n.start(t); n.stop(t+sec+.05); });
}
function cutSound(){
  const a = audio(); if (!a) return; const t = a.currentTime;
  [0, .08].forEach(d => { const s = a.createBufferSource(); s.buffer = noiseBuf(a); const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2600; const g = a.createGain(); env(g, t+d, .35, .002, .02, .05); s.connect(hp).connect(g).connect(master); s.start(t+d); s.stop(t+d+.1); });
  const o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(90, t+.1); env(g, t, .25, .004, .02, .1); o.connect(g).connect(master); o.start(t); o.stop(t+.2);
}
function coinSound(delay=0){
  const a = audio(); if (!a) return; const t = a.currentTime + delay;
  [[988,0,.06],[1319,.06,.28]].forEach(([f,d,r]) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = f; env(g, t+d, .12, .004, .02, r); o.connect(g).connect(master); o.start(t+d); o.stop(t+d+r+.05); });
}
function pop(f=640){ const a = audio(); if (!a) return; const t = a.currentTime; const o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f*1.6, t+.07); env(g, t, .1, .004, .02, .07); o.connect(g).connect(master); o.start(t); o.stop(t+.15); }
function swish(){ const a = audio(); if (!a) return; const t = a.currentTime; const s = a.createBufferSource(); s.buffer = noiseBuf(a); const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(3200, t+.12); const g = a.createGain(); env(g, t, .12, .01, .03, .09); s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t+.2); }
function meow(){
  const a = audio(); if (!a) return; const t = a.currentTime;
  const o = a.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(860, t+.16); o.frequency.linearRampToValueAtTime(470, t+.5);
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(900, t); bp.frequency.linearRampToValueAtTime(1500, t+.18); bp.frequency.linearRampToValueAtTime(800, t+.5); bp.Q.value = 3;
  const g = a.createGain(); env(g, t, .25, .04, .26, .2);
  o.connect(bp).connect(g).connect(master); o.start(t); o.stop(t+.6);
}
function tick(){ const a = audio(); if (!a) return; const t = a.currentTime; const s = a.createBufferSource(); s.buffer = noiseBuf(a); const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000; const g = a.createGain(); env(g, t, .2, .001, .005, .02); s.connect(hp).connect(g).connect(master); s.start(t); s.stop(t+.05); }

/* ---------- SVG helpers (parse as real SVG so every engine, incl. iOS Safari, draws it) ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function setSVG(el, markup){
  let ok = false;
  try {
    const doc = new DOMParser().parseFromString(`<svg xmlns="${SVGNS}">${markup}</svg>`, 'image/svg+xml');
    if (!doc.getElementsByTagName('parsererror').length){
      while (el.firstChild) el.removeChild(el.firstChild);
      Array.from(doc.documentElement.childNodes).forEach(n => el.appendChild(document.importNode(n, true)));
      ok = true;
    }
  } catch(e){}
  if (!ok){ console.warn('svg-fallback', el.id); el.innerHTML = markup; }
}
// animate an SVG element through its transform attribute
function svgAnim(el, dur, fn){
  if (!el) return Promise.resolve();
  const tok = {}; el._anim = tok;
  return tween(dur, t => { if (el._anim === tok) el.setAttribute('transform', fn(t)); }, x => x)
    .then(() => { if (el._anim === tok) el.removeAttribute('transform'); });
}
function cashierJump(){ svgAnim($('#cashier'), 650, t => { const up = -22*Math.sin(Math.PI*Math.min(1, t/.7)); const sq = t > .7 ? Math.sin(Math.PI*(t-.7)/.3)*.05 : 0; return `translate(0 ${up.toFixed(2)}) translate(0 344) scale(${(1+sq).toFixed(3)} ${(1-sq).toFixed(3)}) translate(0 -344)`; }); }

const stage = $('#stage'), wrap = $('#stageWrap'), order = $('#order'), hud = $('.hud');
const BTN_IDS = ['#btnCust', '#btnCart', '#btnRec', '#btnPay'];
// On narrow screens show a cropped, larger view of the diorama (store + belt end) and move controls into normal page flow.
const CROP = {x:28, y:194, w:850, h:520};
let scale = 1, compact = false, side = false;
function fit(){
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  compact = vw < 900;
  side = compact && vw > vh && vw >= 600;
  document.body.classList.toggle('compact', compact);
  document.body.classList.toggle('side', side);
  const slot = $('#mobileSlot'), mt = $('#mtool'), btns = $('#mtoolBtns');
  if (compact){
    if (order.parentElement !== slot) slot.appendChild(order);
    if (hud.parentElement !== mt){ BTN_IDS.forEach(id => btns.appendChild($(id))); mt.appendChild(hud); }
  } else {
    if (hud.parentElement !== stage){ BTN_IDS.forEach(id => stage.appendChild($(id))); stage.appendChild(hud); }
    if (order.parentElement !== stage) stage.appendChild(order);
  }
  wrap.style.width = '';
  const ww = wrap.clientWidth;
  if (compact){
    const toolH = $('#mtool').getBoundingClientRect().height;
    const maxH = side ? Math.max(160, vh - toolH - 36) : Infinity;
    scale = Math.min(ww / CROP.w, maxH / CROP.h, 1.12);
    wrap.style.width = (CROP.w * scale) + 'px';
    wrap.style.height = (CROP.h * scale) + 'px';
    stage.style.left = '0px';
    stage.style.transform = `translate(${(-CROP.x * scale).toFixed(2)}px, ${(-CROP.y * scale).toFixed(2)}px) scale(${scale})`;
  } else {
    const avH = Math.max(380, vh - 30);
    scale = Math.min(ww/1200, avH/720, 1.3);
    stage.style.transform = `scale(${scale})`;
    stage.style.left = Math.max(0, (ww - 1200*scale)/2) + 'px';
    wrap.style.height = (720*scale) + 'px';
  }
}
let fitRaf = 0;
const refit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); };
window.addEventListener('resize', refit);

/* ================= conveyor ================= */
const SCAN_X = 700, GAP = 108, SPEED = 230, BASE_Y = 548;
const queue = []; let running = false, lastT = 0, beltOff = 0;
const beltTop = $('#beltTop');
function place(it){ it.el.style.transform = `translate(${(it.x - 48).toFixed(1)}px, ${BASE_Y - 92}px)`; }
function spawnItem(entry){
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<div class="item-in"><svg viewBox="0 0 100 100"><use href="#ic-${entry.cat}"/></svg><span class="tag">$${fmt(entry.price)}</span></div>`;
  stage.appendChild(el);
  const last = queue[queue.length-1];
  const spawn = compact ? CROP.x + CROP.w - 70 : 1120;
  const x = Math.max(spawn, last ? last.x + GAP : 0);
  const it = {el, x, entry, state: x > spawn + 30 ? 'move' : 'drop'};
  place(it); queue.push(it);
  if (it.state === 'drop'){ el.classList.add('drop'); pop(420); setTimeout(() => { it.state = 'move'; el.classList.remove('drop'); }, 480); }
  if (!running){ running = true; lastT = performance.now(); requestAnimationFrame(loop); }
}
function loop(now){
  const dt = Math.min(.05, (now - lastT)/1000); lastT = now;
  let moving = false;
  queue.forEach((it, i) => {
    if (it.state !== 'move') return;
    const target = SCAN_X + i*GAP;
    if (it.x > target + .5){ it.x = Math.max(target, it.x - SPEED*dt); moving = true; it.el.classList.add('moving'); }
    else it.el.classList.remove('moving');
    place(it);
  });
  const head = queue[0];
  if (head && head.state === 'move' && head.x <= SCAN_X + .5) scan(head);
  if (moving){ beltOff -= SPEED*dt; beltTop.style.backgroundPosition = `0 0, ${beltOff.toFixed(1)}px 0`; }
  if (queue.length) requestAnimationFrame(loop); else running = false;
}

  it.state = 'scan'; it.el.classList.remove('moving');
  await tween(150, t => setArm(10*t));
  const nose = {x:640, y:485}, cx = it.x, cy = BASE_Y - 44;
  const beam = $('#beam'), sl = $('#scanline');
  beam.setAttribute('points', `${nose.x},${nose.y} ${cx-30},${cy-26} ${cx-30},${cy+30}`);
  sl.setAttribute('x1', cx - 34); sl.setAttribute('x2', cx + 34); sl.setAttribute('y1', cy); sl.setAttribute('y2', cy);

  const bt = document.createElement('div'); bt.className = 'beep-text'; bt.textContent = 'Beep!'; bt.style.left = '560px'; bt.style.top = '418px'; stage.appendChild(bt); setTimeout(() => bt.remove(), 900);

  tween(220, t => setArm(10*(1-t)));

}

  const x0 = it.x, y0 = BASE_Y - 46, x1 = 394, y1 = 459;

/* ================= receipt ================= */
function rocPeriod(k){ const d = parseKey(k); const m = d.getMonth()+1, s = m % 2 ? m : m-1; return `${d.getFullYear()-1911}年${pad(s)}-${pad(s+1)}月`; }
function genNo(){ const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = L[Math.floor(Math.random()*24)] + L[Math.floor(Math.random()*24)] + '-'; for (let i=0;i<8;i++) s += Math.floor(Math.random()*10); return s; }
function barcode(seed){ const r = rng(hash(seed)); let s = '', w = 0; while (w < 170){ const bw = 1 + Math.floor(r()*3), gap = 1 + Math.floor(r()*3); s += `<i style="width:${bw}px;margin-right:${gap}px"></i>`; w += bw + gap; } return s; }
function qr(seed){
  const r = rng(hash(seed)), n = 21; let s = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1C1D22"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1C1D22"/>`;
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){ const inF = (x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12); if (!inF && r() < .48) s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1C1D22"/>`; }
  return `<svg viewBox="-1 -1 23 23" shape-rendering="crispEdges"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/>${finder(0,0)}${finder(14,0)}${finder(0,14)}${s}</svg>`;
}
function receiptHTML(day, o = {}){
  const d = parseKey(day.date), total = dayTotal(day), n = day.entries.length;
  const at = day.settledAt ? new Date(day.settledAt) : new Date();
  const seed = day.date + (day.receiptNo || '');
  const rnd = String(hash(seed) % 10000).padStart(4, '0');
  const rows = day.entries.map(e => {
    const t = e.t ? new Date(e.t) : null;
    return `<div class="rl r-item${o.editable ? ' editable' : ''}"><svg viewBox="0 0 100 100"><use href="#ic-${e.cat}"/></svg><span>${esc(e.name)}<small>${(CAT[e.cat]||CAT.other).label}${e.cart ? '・清單' : ''}${t ? '・' + pad(t.getHours()) + ':' + pad(t.getMinutes()) : ''}</small></span><span class="amt">${fmt(e.price)}</span>${o.editable ? `<button class="ri-del" data-del="${e.id}" aria-label="刪除 ${esc(e.name)}">×</button>` : ''}</div>`;
  }).join('');
  let earn = '';
  if (o.earned != null){
    earn = o.earned > 0
      ? `<div class="rl r-earn" id="earnLine"><span>本日記帳 ${n} 筆・獲得積分</span><b>+${o.earned}${o.bonus ? '（含滿 5 筆加碼 20）' : ''}</b></div><div class="rl r-earn"><span>累積積分</span><b>${fmt(o.pointsAfter)}</b></div>`
      : `<div class="rl r-earn" id="earnLine"><span>本日積分已領過</span><b>累積 ${fmt(o.pointsAfter)}</b></div>`;
  } else if (day.settled){
    earn = `<div class="rl r-earn"><span>本日獲得積分</span><b>+${day.earned || 0}</b></div>`;
  }
  return `<div class="receipt${o.torn ? ' torn' : ''}">
    <div class="rl r-top"></div>
    <div class="rl r-store">${esc(S.storeName || '天天記帳舖')}</div>
    <div class="rl r-title">記帳明細證明聯</div>
    <div class="rl r-period">${rocPeriod(day.date)}</div>
    <div class="rl r-no">${day.receiptNo || '尚未結帳'}</div>
    <div class="rl r-meta">${day.date}（${WD[d.getDay()]}）${day.settledAt ? pad(at.getHours()) + ':' + pad(at.getMinutes()) + ':' + pad(at.getSeconds()) : ''}</div>
    <div class="rl r-meta2"><span>隨機碼 ${rnd}</span><span>總計 ${fmt(total)}</span></div>
    <div class="rl r-meta2"><span>筆數 ${n}</span><span>${esc(S.storeName || '天天記帳舖')}會員</span></div>
    <div class="rl r-bar">${barcode(seed)}</div>
    <div class="rl r-qr">${qr(seed + 'L')}${qr(seed + 'R')}</div>
    <div class="rl r-sep">- - - 明　細 - - -</div>
    ${rows}
    <div class="rl r-sep2"></div>
    <div class="rl r-total"><span>合計</span><span>NT$ ${fmt(total)}</span></div>
    ${earn}
    <div class="rl r-thanks">謝謝光臨・明天也要記帳喔</div>
    <div class="rl r-end"></div>
  </div>`;
}

/* ================= checkout (zoom printer + print) ================= */
let busy = false, skip = false, filed = false;
const ov = $('#printOv'), paper = $('#paper'), inner = $('#paperInner'), bigP = $('#bigPrinter');
bigP.innerHTML = `<svg viewBox="0 0 240 180">${$('#printerSym').innerHTML}</svg>`;
function sizePrinter(){ const pw = Math.min(560, window.innerWidth*(window.innerWidth < 500 ? .96 : .92), (window.innerHeight*.42)*240/180); $('#printStage').style.setProperty('--pw', pw + 'px'); return pw; }
async function checkout(){
  if (busy) return;
  audio();
  const k = todayKey(), day = DAYS[k];
  if (!day || !day.entries.length){ say('今天還沒有記帳喔！先在右邊記一筆吧', 2600); face('o'); cashierJump(); return; }
  busy = true; skip = false; filed = false;
  const n = day.entries.length, fresh = Math.max(0, n - (day.rewarded || 0));
  const bonus = (n >= 5 && !day.bonus) ? 20 : 0;
  const earned = fresh*10 + bonus;
  if (!day.receiptNo) day.receiptNo = genNo();
  day.settledAt = new Date().toISOString();
  const before = S.points, after = before + earned;
  say('好的！幫你印今天的明細～', 2400); face('grin', 1200);
  $('#btnPay').classList.add('pressed'); setTimeout(() => $('#btnPay').classList.remove('pressed'), 180);

  // prepare overlay
  inner.innerHTML = receiptHTML(day, {earned, bonus, pointsAfter: after});
  inner.style.transform = ''; inner.style.position = 'absolute'; inner.style.transition = 'none';
  paper.style.transition = 'none'; paper.style.height = '0px'; paper.style.overflowY = 'hidden'; paper.scrollTop = 0;
  $('#pchipVal').textContent = fmt(before);
  $('#printDone').classList.remove('on'); $('.ov-top').classList.remove('done'); $('#scrollHint').classList.remove('on'); $('#skipBtn').style.display = '';
  sizePrinter();
  ov.classList.add('open');
  const scenePrinter = $('#printerSpot svg');
  const src = scenePrinter.getBoundingClientRect();
  const dst = bigP.getBoundingClientRect();
  scenePrinter.style.opacity = 0;
  bigP.style.transition = 'none';
  bigP.style.transform = `translate(${src.left - dst.left}px, ${src.top - dst.top}px) scale(${src.width / dst.width})`;
  void bigP.offsetWidth;
  requestAnimationFrame(() => { ov.classList.add('show'); bigP.style.transition = 'transform .8s cubic-bezier(.3,1.15,.4,1)'; bigP.style.transform = 'none'; });
  swish();
  try { await document.fonts.ready; } catch(e){}
  await sleep(reduced ? 50 : 850);

  // print line by line
  const maxH = Math.max(160, $('#paperWrap').getBoundingClientRect().bottom - $('.ov-top').getBoundingClientRect().bottom - 12);
  const setPaper = (h, dur, steps) => {
    const vis = Math.min(h, maxH), off = Math.max(0, h - maxH);
    const tr = dur ? `${dur}ms steps(${steps}, end)` : 'none';
    paper.style.transition = dur ? `height ${tr}` : 'none'; paper.style.height = vis + 'px';
    inner.style.transition = dur ? `transform ${tr}` : 'none'; inner.style.transform = `translateY(${-off}px)`;
  };
  bigP.classList.add('printing');
  let cur = 0;
  const lines = $$('.rl', inner);
  for (const ln of lines){
    if (skip) break;
    const target = ln.offsetTop + ln.offsetHeight;
    const delta = target - cur; if (delta <= 0) continue;
    const dur = reduced ? 20 : Math.max(120, Math.min(950, delta*8));
    setPaper(target, dur, Math.max(2, Math.round(delta/3)));
    buzz(dur/1000);
    await sleep(dur + (reduced ? 0 : 50 + Math.random()*110));
    cur = target;
  }
  const full = inner.scrollHeight;
  setPaper(full, 0, 1);
  bigP.classList.remove('printing');
  $('#skipBtn').style.display = 'none';
  await sleep(160);
  cutSound();
  inner.querySelector('.receipt').classList.add('torn');
  // award points
  day.settled = true; day.rewarded = n; if (bonus) day.bonus = true; day.earned = (day.earned || 0) + earned;
  S.points = after;
  saveDay(k); saveState(); updateHud();
  // let the paper scroll if it is taller than the room
  inner.style.transition = 'none'; inner.style.transform = 'none'; inner.style.position = 'relative';
  paper.style.overflowY = 'auto'; paper.scrollTop = paper.scrollHeight;
  if (earned > 0) awardFx(before, after);
  $('#printDone').classList.add('on'); $('.ov-top').classList.add('done');
  $('#fileBtn').focus({preventScroll:true});
  // receipt taller than the screen: roll back to the top so the header can be read, then hint that it scrolls
  if (paper.scrollHeight > paper.clientHeight + 4){
    await sleep(earned > 0 ? 1900 : 500);
    if (!ov.classList.contains('open')) return;
    const from = paper.scrollTop;
    await tween(reduced ? 1 : 1100, t => { paper.scrollTop = from * (1 - t); });
    const hint = $('#scrollHint'); hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 2600);
  }
}
function awardFx(before, after){
  const line = $('#earnLine'), chip = $('.ov-top .pchip');
  const from = (line ? line.getBoundingClientRect() : paper.getBoundingClientRect());
  const to = chip.getBoundingClientRect();
  const ep = document.createElement('div'); ep.className = 'earn-pop'; ep.textContent = `+${after - before} 積分`;
  ep.style.left = (from.left + from.width/2 - 60) + 'px'; ep.style.top = (from.top - 30) + 'px'; document.body.appendChild(ep); setTimeout(() => ep.remove(), 1500);
  const cnt = Math.min(10, 3 + Math.floor((after-before)/10));
  for (let i=0;i<cnt;i++){
    const c = document.createElement('div'); c.className = 'coin'; c.textContent = '★';
    const sx = from.left + from.width/2 + (Math.random()*80-40), sy = from.top + 10;
    c.style.left = sx + 'px'; c.style.top = sy + 'px'; document.body.appendChild(c);
    const tx = to.left + to.width/2 - sx, ty = to.top + to.height/2 - sy;
    c.animate([{transform:'translate(0,0) scale(.6)', opacity:0},{transform:`translate(${tx*.3}px,${ty*.3 - 60}px) scale(1.1)`, opacity:1, offset:.35},{transform:`translate(${tx}px,${ty}px) scale(.7)`, opacity:1}], {duration:800 + i*70, easing:'cubic-bezier(.4,0,.6,1)', delay:i*60})
      .onfinish = () => { c.remove(); };
    coinSound((800 + i*130)/1000);
  }
  setTimeout(() => { tween(700, t => $('#pchipVal').textContent = fmt(Math.round(before + (after-before)*t))); chip.classList.remove('glow'); void chip.offsetWidth; chip.classList.add('glow'); }, 700);
}
function closePrint(fileIt){
  if (!busy) return;
  const sceneP = $('#printerSpot svg');
  $('#scrollHint').classList.remove('on');
  const done = () => { ov.classList.remove('open', 'show'); sceneP.style.opacity = 1; busy = false; showPoints(); updateHud(); };
  if (fileIt && !reduced){
    const r = $('#paperWrap').getBoundingClientRect(), b = $('#btnRec').getBoundingClientRect();
    const fp = document.createElement('div'); fp.className = 'fly-paper';
    Object.assign(fp.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
    document.body.appendChild(fp);
    paper.style.visibility = 'hidden';
    ov.classList.remove('show');
    swish();
    fp.animate([{transform:'none'},{transform:`translate(${b.left + b.width/2 - r.left - r.width/2}px, ${b.top + b.height/2 - r.top - r.height/2}px) scale(.08) rotate(-30deg)`, opacity:.6}], {duration:650, easing:'cubic-bezier(.5,0,.7,1)'}).onfinish = () => {
      fp.remove(); paper.style.visibility = ''; done();
      const rb = $('#btnRec'); rb.classList.remove('bump'); void rb.offsetWidth; rb.classList.add('bump'); pop(880);
      say('明細收進紀錄夾了！', 2200);
    };
  } else { ov.classList.remove('show'); setTimeout(done, 300); }
}
$('#skipBtn').addEventListener('click', () => { skip = true; });
$('#fileBtn').addEventListener('click', () => closePrint(true));
$('#closePrint').addEventListener('click', () => closePrint(false));
$('#btnPay').addEventListener('click', checkout);

/* ================= records (binder clip) ================= */
const recOv = $('#recOv');
let recList = [], recCur = 0;
function openOv(el){ el.classList.add('open'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show'))); }
function closeOv(el){ el.classList.remove('show'); setTimeout(() => el.classList.remove('open'), 320); }
$$('.overlay [data-close]').forEach(b => b.addEventListener('click', () => closeOv(b.closest('.overlay'))));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const top = ['#detOv','#custOv','#cartOv','#recOv'].map(s => $(s)).find(o => o.classList.contains('open')); if (top) closeOv(top); else if (busy && $('#printDone').classList.contains('on')) closePrint(false); }
  if (recOv.classList.contains('open') && !$('#detOv').classList.contains('open')){ if (e.key === 'ArrowRight') flipTo(recCur+1); if (e.key === 'ArrowLeft') flipTo(recCur-1); }
});
function slipHTML(d){
  const dt = parseKey(d.date), total = dayTotal(d), n = d.entries.length, show = d.entries.slice(0, 7);
  return `<div class="slip-in">
    <div class="slip-store">${esc(S.storeName || '天天記帳舖')}</div>
    <div class="slip-title">記帳明細</div>
    <div class="slip-date">${dt.getFullYear()}.${pad(dt.getMonth()+1)}.${pad(dt.getDate())}（${WD[dt.getDay()]}）</div>
    <div>${show.map(e => `<div class="slip-row"><svg viewBox="0 0 100 100"><use href="#ic-${e.cat}"/></svg><span>${esc(e.name)}</span><span>${fmt(e.price)}</span></div>`).join('')}
    ${n > 7 ? `<div class="more">……還有 ${n-7} 筆</div>` : ''}</div>
    <div class="slip-total"><span>合計</span><b>NT$ ${fmt(total)}</b></div>
    <div class="slip-foot">${n} 筆${d.settled ? `・獲得積分 +${d.earned || 0}` : '・還沒結帳'}</div>
    <div class="stamp ${d.settled ? 'ok' : 'no'}">${d.settled ? '已結帳' : '未結帳'}</div>
  </div>`;
}
const CLIP_SVG = `<svg class="clip-svg" viewBox="0 0 150 96" aria-hidden="true">
  <defs><linearGradient id="clipBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6075"/><stop offset=".5" stop-color="#22252F"/><stop offset="1" stop-color="#0F1116"/></linearGradient></defs>
  <path d="M42 54 L32 8 Q31 2 37 2 L60 2 Q64 2 63 8 L58 54" fill="none" stroke="url(#g-chrome)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M92 54 L87 8 Q86 2 90 2 L113 2 Q119 2 118 8 L108 54" fill="none" stroke="url(#g-chrome)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M22 50 L128 50 L120 92 L30 92 Z" fill="url(#clipBody)"/>
  <path d="M26 54 L124 54" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <ellipse cx="44" cy="52" rx="7" ry="4" fill="#9AA5B8"/><ellipse cx="106" cy="52" rx="7" ry="4" fill="#9AA5B8"/>
</svg>`;
function openRecords(){
  audio(); pop(760);
  recList = Object.values(DAYS).filter(d => d.entries.length).sort((a,b) => a.date < b.date ? 1 : -1);
  recCur = Math.min(recCur, Math.max(0, recList.length-1));
  const now = new Date(), mk = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const mDays = recList.filter(d => d.date.startsWith(mk));
  $('#monthSum').innerHTML = `本月共 <b>${mDays.reduce((s,d) => s + d.entries.length, 0)}</b> 筆・支出 <b>NT$ ${fmt(mDays.reduce((s,d) => s + dayTotal(d), 0))}</b>・累積積分 <b>${fmt(S.points)}</b>`;
  const body = $('#recBody');
  if (!recList.length){ body.innerHTML = `<div class="empty">紀錄夾還是空的。<br>在右邊記下第一筆，按「結帳」把明細印出來，它就會夾在這裡。</div>`; openOv(recOv); return; }
  body.innerHTML = `<div class="clip-area" id="clipArea">${CLIP_SVG}<div class="board"></div><div id="stack">${recList.map((d,i) => `<div class="slip" data-i="${i}">${slipHTML(d)}</div>`).join('')}</div></div>
    <div class="rec-nav"><button class="nav-btn" id="prevBtn" aria-label="較新的一天">‹</button><div class="rec-label" id="recLabel"></div><button class="nav-btn" id="nextBtn" aria-label="較舊的一天">›</button></div>
    <div class="scrub" id="scrub">${recList.map(() => '<i></i>').join('')}</div>
    <div class="hint">${matchMedia('(hover: none)').matches ? '在紙張上左右滑動翻頁・點一下看完整明細' : '滑鼠在紙張上左右移動就能翻頁・點一下看完整明細'}</div>`;
  const area = $('#clipArea');
  area.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const r = area.getBoundingClientRect(); const ratio = (e.clientX - r.left)/r.width; flipTo(Math.floor(Math.min(.999, Math.max(0, ratio)) * recList.length)); });
  area.addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaY) + Math.abs(e.deltaX) < 4) return; flipTo(recCur + ((e.deltaY || e.deltaX) > 0 ? 1 : -1)); }, {passive:false});
  let tx = null, tCur = 0, moved = false;
  area.addEventListener('touchstart', e => { tx = e.touches[0].clientX; tCur = recCur; moved = false; }, {passive:true});
  area.addEventListener('touchmove', e => { if (tx == null) return; const dx = tx - e.touches[0].clientX; if (Math.abs(dx) > 8) moved = true; flipTo(tCur + Math.round(dx/50)); }, {passive:true});
  area.addEventListener('touchend', () => { tx = null; });
  $('#stack').addEventListener('click', e => { if (moved){ moved = false; return; } const s = e.target.closest('.slip'); if (s && Number(s.dataset.i) === recCur) openDetail(recList[recCur].date); });
  $('#prevBtn').addEventListener('click', () => flipTo(recCur-1));
  $('#nextBtn').addEventListener('click', () => flipTo(recCur+1));
  updateFlip(true);
  openOv(recOv);
}
function flipTo(i){ i = Math.max(0, Math.min(recList.length-1, i)); if (i === recCur) return; recCur = i; swish(); updateFlip(); }
function updateFlip(){
  $$('#stack .slip').forEach((el, i) => {
    const k = i - recCur;
    if (k < 0){ el.style.transform = `translateY(-8px) rotateX(${150 + Math.max(-6,k)*3}deg)`; el.style.opacity = 0; el.style.zIndex = 200 + k; el.style.pointerEvents = 'none'; }
    else { const r = ((hash(recList[i].date) % 9) - 4) * .45; el.style.transform = `translateY(${Math.min(k,6)*5}px) rotate(${k ? r : 0}deg)`; el.style.opacity = k > 6 ? 0 : 1; el.style.zIndex = 100 - k; el.style.pointerEvents = k === 0 ? 'auto' : 'none'; }
  });
  const d = recList[recCur]; if (!d) return;
  const dt = parseKey(d.date);
  $('#recLabel').textContent = `${dt.getMonth()+1}月${dt.getDate()}日（${WD[dt.getDay()]}）・${recCur+1}/${recList.length}`;
  $$('#scrub i').forEach((x, i) => x.classList.toggle('on', i === recCur));
  $('#prevBtn').disabled = recCur === 0; $('#nextBtn').disabled = recCur === recList.length-1;
}
function openDetail(key){
  const d = DAYS[key]; if (!d) return;
  const dt = parseKey(key);
  $('#detTitle').textContent = `${dt.getMonth()+1}月${dt.getDate()}日 明細`;
  $('#detPaper').innerHTML = receiptHTML(d, {editable:true, torn:true});
  $('#detPaper').dataset.key = key;
  pop(700); openOv($('#detOv'));
}
$('#detPaper').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const key = $('#detPaper').dataset.key, d = DAYS[key]; if (!d) return;
  const row = b.closest('.r-item');
  if (!row.classList.contains('arm')){ row.classList.add('arm'); b.textContent = '刪'; b.style.background = '#FFE1DC'; b.style.color = '#F0614F'; b.setAttribute('aria-label', '再按一次確認刪除'); setTimeout(() => { if (row.isConnected){ row.classList.remove('arm'); b.textContent = '×'; b.style.background = ''; b.style.color = ''; } }, 2500); return; }
  d.entries = d.entries.filter(x => x.id !== b.dataset.del);
  d.rewarded = Math.min(d.rewarded || 0, d.entries.length);
  saveDay(key); updateHud(); monSummary(); tick();
  if (d.entries.length) openDetail(key); else closeOv($('#detOv'));
  if (recOv.classList.contains('open')){ const keep = recCur; openRecords(); recCur = Math.min(keep, recList.length-1); if (recList.length) updateFlip(); }
});
$('#btnRec').addEventListener('click', openRecords);

/* ================= customize ================= */
const custOv = $('#custOv');
let custTab = 'store', pending = null;
const owns = (kind, o) => !o.cost || S.owned.includes(kind + ':' + o.id);

}
function renderCust(){
  $('#custPts').textContent = fmt(S.points);
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === custTab));
  const L = S.look; let h = '';
  if (custTab === 'store'){
    h += `<div class="sec"><h4>店名 <small>會出現在招牌和收據上</small></h4><div class="name-row"><input id="storeName" maxlength="10" value="${esc(S.storeName)}" aria-label="店名"></div></div>`;
    h += `<div class="sec"><h4>店貓的名字</h4><div class="name-row"><input id="catName" maxlength="8" value="${esc(CATN())}" aria-label="店貓的名字"></div></div>`;
    h += `<div class="sec"><h4>商店場景 <small>用積分解鎖</small></h4><div class="opts">${THEMES.map(t => optTile('theme', t, S.theme === t.id, `<span class="sw" style="background:linear-gradient(180deg, ${t.ceil} 0 14%, ${t.wall} 14% 58%, ${t.cfront} 58% 64%, ${t.cstripe} 64% 69%, ${t.cfront} 69%);box-shadow:inset 0 0 0 3px ${t.sign}"></span>`)).join('')}</div></div>`;
  } else {
    const mini = patch => headSwatch(Object.assign({}, L, patch));
    h += `<div class="sec"><h4>店員的名字 <small>會寫在名牌上</small></h4><div class="name-row"><input id="clerkName" maxlength="6" value="${esc(CLERK())}" aria-label="店員的名字"></div></div>`;
    h += `<div class="sec"><h4>髮型</h4><div class="opts">${HAIRS.map(o => optTile('hair', o, L.hair === o.id, mini({hair:o.id, acc:'none'}))).join('')}</div></div>`;
    h += `<div class="sec"><h4>髮色</h4><div class="opts">${HAIRC.map(o => optTile('hairColor', o, L.hairColor === o.id, `<span class="sw round" style="background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.6), transparent 45%), ${o.c}"></span>`)).join('')}</div></div>`;
    h += `<div class="sec"><h4>制服</h4><div class="opts">${SHIRTS.map(o => optTile('shirt', o, L.shirt === o.id, `<span class="sw" style="background:linear-gradient(90deg, rgba(255,255,255,.3), transparent 40%, rgba(0,0,0,.2)), ${o.c}"></span>`)).join('')}</div></div>`;
    h += `<div class="sec"><h4>配飾</h4><div class="opts">${ACCS.map(o => optTile('acc', o, L.acc === o.id, mini({acc:o.id}))).join('')}</div></div>`;
    h += `<div class="sec"><h4>膚色</h4><div class="opts">${SKINS.map(o => optTile('skin', o, L.skin === o.id, `<span class="sw round" style="background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.6), transparent 45%), ${o.c}"></span>`)).join('')}</div></div>`;
  }
  $('#custBody').innerHTML = h;
  const cn = $('#catName');
  if (cn) cn.addEventListener('change', () => { S.catName = cn.value.trim() || '薇薇'; cn.value = S.catName; saveState(); miniBubble(`${S.catName}：喵～`, 128, 136); meow(); });
  const kn = $('#clerkName');
  if (kn) kn.addEventListener('change', () => { S.clerkName = kn.value.trim() || '小樂'; kn.value = S.clerkName; saveState(); buildCashier(); say(`以後叫我${S.clerkName}吧！`, 2200); face('grin', 1200); cashierJump(); });
  const sn = $('#storeName');
  if (sn) sn.addEventListener('change', () => { S.storeName = sn.value.trim() || '天天記帳舖'; saveState(); applyTheme(); toast('店名改好了'); });
}
const KIND = {theme:THEMES, hair:HAIRS, hairColor:HAIRC, shirt:SHIRTS, acc:ACCS, skin:SKINS};
$('#custBody').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const kind = b.dataset.kind, o = byId(KIND[kind], b.dataset.id), key = kind + ':' + o.id;
  if (!owns(kind, o)){
    if (S.points < o.cost){ b.classList.remove('cant'); void b.offsetWidth; b.classList.add('cant'); toast(`還差 ${o.cost - S.points} 積分，多記幾筆再來`); return; }
    if (pending !== key){ pending = key; pop(500); renderCust(); return; }
    S.points -= o.cost; S.owned.push(key); pending = null; coinSound(); toast(`解鎖「${o.name}」！`);
  } else pending = null;
  if (kind === 'theme') S.theme = o.id; else S.look[kind] = o.id;
  saveState(); applyAll(); renderCust(); pop(820);
  if (kind !== 'theme'){ say('新造型！好看嗎？', 2000); face('grin', 1200); cashierJump(); }
});
$$('.tab').forEach(t => t.addEventListener('click', () => { custTab = t.dataset.tab; pending = null; renderCust(); }));
function openCustomize(tab){ audio(); pop(760); if (tab) custTab = tab; pending = null; renderCust(); openOv(custOv); }
$('#btnCust').addEventListener('click', () => openCustomize());

/* ================= shopping list ================= */
const cartOv = $('#cartOv');
let cartCat = 'daily';
const SUGG = [{name:'衛生紙', cat:'daily', price:129},{name:'鮮奶', cat:'drink', price:89},{name:'雞蛋', cat:'food', price:75},{name:'洗衣精', cat:'daily', price:199},{name:'悠遊卡加值', cat:'trans', price:500},{name:'筆記本', cat:'study', price:45}];
function cartDoneIds(){ const d = DAYS[todayKey()]; return new Set(d ? d.entries.filter(e => e.cart).map(e => e.cart) : []); }
function updateCartBadge(){ const done = cartDoneIds(); const left = S.cart.filter(i => !done.has(i.id)).length; const b = $('#cartBadge'); b.textContent = left; b.hidden = !left; }
function buildCartCats(){ $('#cartCats').innerHTML = CATS.map(c => `<button type="button" class="ccat" role="radio" aria-checked="${c.id===cartCat}" data-cat="${c.id}"><svg viewBox="0 0 100 100"><use href="#ic-${c.id}"/></svg>${c.label}</button>`).join(''); }
$('#cartCats').addEventListener('click', e => { const b = e.target.closest('.ccat'); if (!b) return; cartCat = b.dataset.cat; $$('.ccat').forEach(x => x.setAttribute('aria-checked', x === b)); pop(560); });
function renderCart(){
  const done = cartDoneIds();
  const items = [...S.cart].sort((a,b) => (done.has(a.id) - done.has(b.id)));
  const bought = S.cart.filter(i => done.has(i.id));
  const d = DAYS[todayKey()];
  const spent = d ? d.entries.filter(e => e.cart).reduce((s,e) => s + Number(e.price||0), 0) : 0;
  $('#cartSum').innerHTML = S.cart.length ? `<span>今天買了 <b>${bought.length}</b> / ${S.cart.length} 項</span><span>清單花費 <b>NT$ ${fmt(spent)}</b></span>` : '';
  const list = $('#cartList');
  if (!S.cart.length){
    list.innerHTML = `<div class="cart-empty">清單還是空的。在上面輸入常買的東西，或先點下面幾個試試：<div class="sugg">${SUGG.map((x,i) => `<button type="button" data-sugg="${i}">${x.name}・$${x.price}</button>`).join('')}</div></div>`;
  } else {
    list.innerHTML = items.map(i => { const on = done.has(i.id); return `<div class="crow${on ? ' done' : ''}" data-id="${i.id}">
      <button type="button" class="cbox" role="checkbox" aria-checked="${on}" aria-label="${on ? '取消勾選' : '買了'} ${esc(i.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <svg class="cic" viewBox="0 0 100 100" aria-hidden="true"><use href="#ic-${i.cat}"/></svg>
      <div class="cname"><span class="cn">${esc(i.name)}</span><small>${(CAT[i.cat]||CAT.other).label}${on ? '・已記入今天明細' : ''}</small></div>
      <label class="cprice"><span>$</span><input type="number" inputmode="numeric" min="1" step="1" value="${i.price || ''}" placeholder="金額" aria-label="${esc(i.name)} 金額"${on ? ' disabled' : ''}></label>
      <button type="button" class="cdel" aria-label="從清單移除 ${esc(i.name)}">×</button>
    </div>`; }).join('');
  }
  updateCartBadge();
}
function addCartItem(name, cat, price){
  if (S.cart.length >= 60){ toast('清單最多 60 項，先移除一些吧'); return false; }
  if (S.cart.some(i => i.name === name)){ toast(`「${name}」已經在清單上了`); return false; }
  S.cart.push({id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), name, cat, price: price || 0});
  saveState(); renderCart(); pop(820); return true;
}
$('#cartAdd').addEventListener('submit', e => {
  e.preventDefault(); audio();
  const name = $('#cName').value.trim();
  if (!name){ const n = $('#cName'); n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); n.focus(); return; }
  const price = Math.max(0, Math.round(Number($('#cPrice').value) || 0));
  if (addCartItem(name, cartCat, price)){ $('#cName').value = ''; $('#cPrice').value = ''; if (!compact) $('#cName').focus(); else document.activeElement.blur(); }
});
$('#cartList').addEventListener('click', e => {
  const sg = e.target.closest('[data-sugg]');
  if (sg){ const x = SUGG[Number(sg.dataset.sugg)]; addCartItem(x.name, x.cat, x.price); return; }
  const row = e.target.closest('.crow'); if (!row) return;
  const item = S.cart.find(i => i.id === row.dataset.id); if (!item) return;
  if (e.target.closest('.cbox')) return toggleCart(item, row);
  const del = e.target.closest('.cdel');
  if (del){
    if (!del.classList.contains('arm')){ del.classList.add('arm'); del.textContent = '移除'; setTimeout(() => { if (del.isConnected){ del.classList.remove('arm'); del.textContent = '×'; } }, 2500); return; }
    S.cart = S.cart.filter(i => i !== item); saveState(); tick(); renderCart(); toast(`已從清單移除「${item.name}」`);
  }
});
$('#cartList').addEventListener('change', e => {
  const inp = e.target.closest('.cprice input'); if (!inp) return;
  const item = S.cart.find(i => i.id === inp.closest('.crow').dataset.id); if (!item) return;
  item.price = Math.max(0, Math.round(Number(inp.value) || 0)); saveState();
});
function toggleCart(item, row){
  audio();
  const k = todayKey(), d = DAYS[k] || (DAYS[k] = normDay(k));
  const ex = d.entries.find(e => e.cart === item.id);
  if (ex){
    d.entries = d.entries.filter(e => e !== ex);
    d.rewarded = Math.min(d.rewarded || 0, d.entries.length);
    saveDay(k); updateHud(); monSummary(); tick(); renderCart();
    toast(`已把「${item.name}」從今天的明細拿掉`);
    return;
  }
  const inp = row.querySelector('.cprice input');
  const price = Math.round(Number(inp.value) || item.price || 0);
  if (!price || price <= 0){ const l = row.querySelector('.cprice'); l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake'); inp.focus(); toast('先填金額，再打勾'); return; }
  if (price > 9999999){ toast('金額太大了，確認一下有沒有多打 0'); return; }
  item.price = price; saveState();
  const entry = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name:item.name, cat:item.cat, price, t:new Date().toISOString(), cart:item.id};
  d.entries.push(entry);
  saveDay(k); updateHud();
  spawnItem(entry);
  pop(980); coinSound();
  say(`清單上的「${item.name}」買到了，幫你記進明細！`, 2600); face('grin', 1200);
  renderCart();
}
function openCart(){ audio(); pop(760); buildCartCats(); renderCart(); openOv(cartOv); }
$('#btnCart').addEventListener('click', openCart);

/* ================= misc ================= */
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
function updateMute(){ $('#muteText').textContent = S.muted ? '音效關' : '音效開'; $('#muteBtn').setAttribute('aria-pressed', S.muted); $('#muteWave').style.display = S.muted ? 'none' : ''; }
$('#muteBtn').addEventListener('click', () => { S.muted = !S.muted; saveLocal(); updateMute(); if (!S.muted) pop(); });
function applyAll(){ applyTheme(); buildCashier(); showPoints(); updateHud(); monSummary(); updateMute(); updateCartBadge(); if ($('#cartOv').classList.contains('open')) renderCart(); }

/* ================= boot ================= */
loadLocal();
buildFloor(); buildCats(); $('#fName').placeholder = CAT[curCat].ph;
fit(); applyAll(); document.addEventListener('pointerdown', () => audio(), {once:true}); updateClock(); setInterval(() => { updateClock(); updateHud(); }, 20000);
if (!S.welcomed){ setTimeout(() => say(`歡迎光臨！我是店員${CLERK()}，點我聊聊天，燈、${CATN()}、盆栽也都能點喔`, 4600), 400); S.welcomed = true; saveLocal(); }
else setTimeout(() => say(`歡迎回來！${CLERK()}等你好久了，今天要記什麼？`, 2600), 400);
initRemote();
})();
</script>
</body>
</html>
